name: Bug or device report
description: Something wrong with Searly, or a report from a ThermoMaven model other than the G1.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Searly or the device did instead.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 10 Pro XL, Android 17
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: ThermoMaven model and firmware
      placeholder: G1, firmware 25
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Searly version or commit
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: Long-press the title on the live screen, tap Copy log and paste it here.
      render: text

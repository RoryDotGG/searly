<!doctype html>
<!-- Store listing images. render.sh opens this once per frame as store.html#<frame> and screenshots it. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;600&display=block">
<link rel="stylesheet" href="vendor/bundle.css">
<style>
/* Char tokens from src/ui/theme.ts */
:root {
  --ground: #0f0d0c; --surface: #181514; --surface-raised: #221d1b; --surface-sunken: #090807;
  --line: #2e2724; --line-strong: #7e6f66;
  --ink: #f7f0e9; --ink-muted: #b8aaa0; --ink-faint: #9a8c82;
  --sear: #ff6436; --sear-pressed: #ff8358; --on-sear: #1d0a03; --sear-text: #ff8b66; --sear-wash: rgba(255, 100, 54, 0.14);
  --signal: #5ccfee; --on-signal: #03212b; --signal-wash: rgba(92, 207, 238, 0.13);
  --warn: #f5b740; --on-warn: #271a00; --warn-wash: rgba(245, 183, 64, 0.13);
  --danger: #ff7d8c; --on-danger: #2a0409; --danger-wash: rgba(255, 125, 140, 0.13);
  --focus: #ffd08a; --scrim: rgba(0, 0, 0, 0.62);
  --heat-0: #5ab8e6; --heat-1: #e7cf8a; --heat-2: #f6a33f; --heat-3: #ff6c38; --heat-4: #ef3d2c;
  --lcd-glass: #9fe6f6; --lcd-segment: #1a2f8f; --lcd-ghost: rgba(26, 47, 143, 0.09);
  --device-body: #d8372a; --device-shade: #a92418; --device-key: #cc3024;
  --probe-steel: #c4c8cc; --probe-steel-dark: #80868c; --probe-band: #1b1b1e;
  --font-display: 'Bricolage Grotesque', sans-serif; --font-sans: 'Instrument Sans', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --radius-md: 18px; --radius-lg: 28px; --radius-pill: 999px;
  --size-touch: 48px; --size-control: 52px; --size-control-lg: 60px;
  --shadow-sheet: 0 -16px 48px rgba(0, 0, 0, 0.6); --shadow-raised: 0 10px 28px rgba(0, 0, 0, 0.4);
  --glow-sear: none;
}
html, body { margin: 0; background: var(--ground); overflow: hidden; }
.frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-sans); }
.ramp { position: absolute; left: 0; right: 0; height: 12px; display: flex; }
.ramp i { flex: 1; } .ramp i:nth-child(1) { background: var(--heat-0); } .ramp i:nth-child(2) { background: var(--heat-1); } .ramp i:nth-child(3) { background: var(--heat-2); } .ramp i:nth-child(4) { background: var(--heat-3); } .ramp i:nth-child(5) { background: var(--heat-4); }
.copy { position: absolute; left: 88px; right: 88px; top: 132px; }
h1 { margin: 0; font: 650 84px/0.98 var(--font-display); letter-spacing: -0.018em; font-variation-settings: 'opsz' 96, 'wdth' 88; text-wrap: balance; }
h1 em { font-style: normal; color: var(--sear-text); }
.sub { margin: 28px 0 0; font: 400 36px/1.32 var(--font-sans); color: var(--ink-muted); text-wrap: pretty; max-width: 860px; }
/* Phone frame around a real device capture */
.phone { position: absolute; padding: 16px; background: #0b0a0a; border-radius: 76px; box-shadow: 0 0 0 2px #3a3330, 0 40px 100px rgba(0, 0, 0, 0.55); }
.phone img { display: block; width: 100%; border-radius: 60px; }
.callout { position: absolute; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 2px var(--line), 0 30px 80px rgba(0, 0, 0, 0.6); background: var(--surface); }
.callout img { display: block; }
.mark { position: absolute; left: 88px; bottom: 88px; }
/* Offline frame */
.facts { position: absolute; left: 88px; right: 88px; top: 500px; display: flex; flex-direction: column; gap: 24px; }
.fact { display: flex; gap: 32px; align-items: center; padding: 40px 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 36px; }
.fact .disc { flex: none; width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; background: var(--signal-wash); color: var(--signal); }
.fact b { display: block; font: 600 40px/1.15 var(--font-display); font-variation-settings: 'opsz' 48, 'wdth' 92; letter-spacing: -0.015em; }
.fact span { display: block; margin-top: 8px; font: 400 30px/1.35 var(--font-sans); color: var(--ink-muted); }
/* Feature graphic */
.feature { position: relative; width: 1024px; height: 500px; overflow: hidden; background: var(--ground); color: var(--ink); }
.feature .lockup { position: absolute; left: 72px; top: 118px; }
.feature .tag { position: absolute; left: 76px; top: 284px; width: 470px; margin: 0; font: 400 31px/1.3 var(--font-sans); color: var(--ink-muted); }
.feature .ramp { bottom: 0; height: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/bundle.js"></script>
<script>
var S = window.Searly, h = React.createElement;
var SHOT = 'shots/';

function Ramp(props) { return h('div', { className: 'ramp', style: props.style }, h('i'), h('i'), h('i'), h('i'), h('i')); }
function Copy(props) { return h('div', { className: 'copy' }, h('h1', null, props.title), h('p', { className: 'sub' }, props.sub)); }
function Phone(props) {
  var w = props.width || 700;
  return h('div', { className: 'phone', style: { width: w, left: props.left === undefined ? (1080 - w - 32) / 2 : props.left, top: props.top || 540 } },
    h('img', { src: SHOT + props.src }));
}
/* A real crop of a capture, enlarged: crop = [x, y, w, h] in capture pixels. */
function Callout(props) {
  var c = props.crop, s = props.width / c[2];
  return h('div', { className: 'callout', style: Object.assign({ width: props.width, height: c[3] * s }, props.style) },
    h('img', { src: SHOT + props.src, style: { width: CAP.width * s, marginLeft: -c[0] * s, marginTop: -c[1] * s } }));
}
function Frame(props) { return h('div', { className: 'frame' }, h(Ramp, { style: { top: 0 } }), props.children); }

/* Capture width and crop boxes, in capture pixels (Pixel 10 Pro XL, 1080 x 2404). */
var CAP = { width: 1080, dial: [150, 300, 780, 780], probe: [36, 1160, 1008, 370] };

var FRAMES = {
  live: function () {
    return h(Frame, null,
      h(Copy, { title: 'Read the core from across the room.', sub: 'The G1 reports every 2 seconds, and the core is the biggest thing on screen.' }),
      h(Phone, { src: 'live.png' }));
  },
  probe: function () {
    return h(Frame, null,
      h(Copy, { title: 'Every sensor, tip to handle.', sub: 'Five zones along the probe, plus the oven or grill air from the cap.' }),
      h(Phone, { src: 'live.png', left: -150 }),
      h(Callout, { src: 'live.png', crop: CAP.probe, width: 820, style: { right: 40, top: 1250 } }));
  },
  cook: function () {
    return h(Frame, null,
      h(Copy, { title: 'Set a target and the G1 confirms it.', sub: 'Start a Manual or Smart cook in °C or °F. A change only shows as applied once the G1 reports it back.' }),
      h(Phone, { src: 'applied.png' }));
  },
  pair: function () {
    return h(Frame, null,
      h(Copy, { title: 'Pair once, and it reconnects by itself.', sub: 'Press OK on the G1 to trust your phone. There is no account to make.' }),
      h('div', { style: { position: 'absolute', left: 24, bottom: -4 } }, h(S.DeviceG1, { width: 470, crop: 360, highlight: 'ok', bluetoothBlink: true })),
      h(Phone, { src: 'paired.png', width: 600, left: 430, top: 600 }));
  },
  offline: function () {
    function fact(icon, title, text) {
      return h('div', { className: 'fact' }, h('div', { className: 'disc' }, h(S.Icon, { name: icon, size: 52 })), h('div', null, h('b', null, title), h('span', null, text)));
    }
    return h(Frame, null,
      h(Copy, { title: 'Your G1, without the cloud.', sub: 'Searly talks only to the G1, directly over Bluetooth.' }),
      h('div', { className: 'facts' },
        fact('cloud-off', 'No internet permission', 'Release builds cannot reach the network at all.'),
        fact('lock', 'No account', 'The pairing key stays in your phone’s secure storage.'),
        fact('bluetooth', 'Works with no signal', 'Searly only needs Bluetooth, so it works in aeroplane mode.'),
        fact('terminal', 'Free and open source', 'MIT licensed, with the source on GitHub.')),
      h('div', { className: 'mark' }, h(S.Wordmark, { size: 64 })));
  },
  themes: function () {
    return h(Frame, null,
      h(Copy, { title: 'Easy to read at night or in a bright kitchen.', sub: 'Searly switches between dark and light with your phone’s theme.' }),
      h(Phone, { src: 'live.png', width: 540, left: 50, top: 560 }),
      h(Phone, { src: 'live-light.png', width: 540, left: 458, top: 700 }));
  },
  feature: function () {
    return h('div', { className: 'feature' },
      h('div', { className: 'lockup' }, h(S.Wordmark, { size: 112 })),
      h('p', { className: 'tag' }, 'Your ThermoMaven G1,', h('br'), 'without the cloud.'),
      h(Callout, { src: 'live.png', crop: CAP.dial, width: 420, style: { right: 70, top: 30, boxShadow: 'none', background: 'none', borderRadius: 0 } }),
      h(Ramp, { style: { bottom: 0 } }));
  }
};

var name = location.hash.slice(1) || 'live';
ReactDOM.createRoot(document.getElementById('root')).render(h(FRAMES[name]));
</script>
</body>
</html>
